# ===================================================================
# Sistema de Chamados do IFRN - API REST
#
# NENHUMA credencial fica fixa aqui: o banco e configurado por
# variaveis de ambiente (veja docker-compose.yml / .env.example).
# ===================================================================

spring.application.name=sistema-chamados
server.port=${SERVER_PORT:8080}

# --------------------------- DataSource ---------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados}
spring.datasource.username=${DB_USERNAME:chamados}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}

# ------------------------------ JPA -------------------------------
# O Hibernate NAO cria nem altera tabelas: apenas valida o esquema gerado pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# ---------------------------- Flyway ------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --------------------------- Paginacao ----------------------------
# Tamanho padrao de 10 itens e maximo de 50 (ex.: ?page=0&size=10&sort=dataAbertura,desc)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

# ----------------------------- HTTP -------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false

# ----------------------------- Logs -------------------------------
logging.level.root=INFO
logging.level.br.edu.ifrn.chamados=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
